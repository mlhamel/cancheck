<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="Scan a beer UPC to check if it is on the November 2026 Molson Coors recall list (CFIA). EN/FR.">
  <title>CanCheck</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='84'%3E%F0%9F%8D%BA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

  <header class="topbar">
    <span class="logo">CanCheck 🍺</span>
    <button id="langToggle" type="button" class="lang-toggle">FR</button>
  </header>

  <main>
    <section id="view-home" class="view">
      <h1 class="tagline" data-i18n="tagline"></h1>
      <p class="intro" data-i18n-html="intro"></p>
      <div class="actions">
        <button id="btnScan" type="button" class="btn btn-primary" data-i18n="startScan"></button>
        <button id="btnManual" type="button" class="btn" data-i18n="manualEntry"></button>
      </div>
    </section>

    <section id="view-scan" class="view" hidden>
      <div class="scan-area">
        <video id="video" playsinline muted autoplay></video>
        <div class="scan-frame"></div>
      </div>
      <p class="hint" data-i18n="scanningHint"></p>
      <p id="scanDebug" class="scan-debug" hidden></p>
      <div id="scanStall" class="scan-stall" hidden>
        <p id="scanStallMsg" data-i18n="cameraStall"></p>
        <button id="btnRetryCamera" type="button" class="btn" data-i18n="retryCamera"></button>
      </div>
      <div class="actions">
        <button id="btnTorch" type="button" class="btn" hidden data-i18n="torch"></button>
        <button id="btnManualScan" type="button" class="btn" data-i18n="typeInstead"></button>
        <button id="btnStop" type="button" class="btn btn-danger" data-i18n="stop"></button>
      </div>
    </section>

    <section id="view-manual" class="view" hidden>
      <h1 class="tagline" data-i18n="manualTitle"></h1>
      <form id="manualForm" novalidate>
        <label class="field-label" for="manualInput" data-i18n="manualHint"></label>
        <input
          id="manualInput"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="17"
          data-i18n-attr="placeholder:manualPlaceholder"
        >
        <p id="manualError" class="field-error" hidden data-i18n="invalidInput"></p>
        <div class="actions">
          <button type="submit" class="btn btn-primary" data-i18n="manualSubmit"></button>
          <button type="button" id="btnManualBack" class="btn" data-i18n="backHome"></button>
        </div>
      </form>
    </section>

    <section id="view-result" class="view" hidden>
      <div id="resultCard" class="result-card" aria-live="polite">
        <div id="resultIcon" class="result-icon" aria-hidden="true"></div>
        <h1 id="resultTitle" class="result-title"></h1>
        <p id="resultBody" class="result-body"></p>

        <div id="resultProduct" class="product" hidden>
          <div class="product-row"><span data-i18n="detailBrand"></span><strong id="detailBrand"></strong></div>
          <div class="product-row"><span data-i18n="detailProduct"></span><strong id="detailProduct"></strong></div>
          <div class="product-row"><span data-i18n="detailSize"></span><strong id="detailSize"></strong></div>
        </div>

        <div id="resultCodesBlock" hidden>
          <p class="codes-lead" data-i18n="codesLead"></p>
          <p class="codes-label" data-i18n="affectedCodes"></p>
          <div id="resultCodes" class="code-chips"></div>
        </div>

        <p id="resultScanned" class="scanned-code"></p>
        <a id="officialLink" class="btn btn-ghost" target="_blank" rel="noopener noreferrer" data-i18n="official"></a>
      </div>

      <div class="actions">
        <button id="btnScanAgain" type="button" class="btn btn-primary" data-i18n="scanAgain"></button>
        <button id="btnHome" type="button" class="btn" data-i18n="backHome"></button>
      </div>
    </section>

    <p id="globalError" class="global-error" hidden></p>
  </main>

  <footer class="site-footer">
    <p id="dataNote"></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"
          crossorigin="anonymous"
          integrity="sha384-BzBxP10ZE72aitqj5UMmUsbKFliP/DZqA8Wq+BNNhlIJDGoEd1tpkMYXOg9+n6sB"
          defer></script>
  <script type="module" src="app.js?v=4"></script>
</body>
</html>
